<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: url('https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=1200&h=630&fit=crop&q=80') center/cover no-repeat;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    position: relative;
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(120deg,
      rgba(4,30,18,.93) 0%,
      rgba(5,70,45,.83) 50%,
      rgba(4,120,80,.62) 100%);
  }
  .noise {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
    background-size: 200px 200px; opacity: .5; pointer-events: none;
  }
  .brand {
    position: absolute; top: 42px; left: 52px;
    display: flex; align-items: center; gap: 10px; z-index: 2;
  }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: #fbbf24; }
  .brand-name {
    font-size: .8rem; font-weight: 800; letter-spacing: 3px;
    text-transform: uppercase; color: rgba(255,255,255,.75);
  }
  .tag {
    position: absolute; top: 36px; right: 52px;
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
    color: #fff; font-size: .78rem; font-weight: 700;
    letter-spacing: 2px; padding: .4rem 1.1rem; border-radius: 20px;
    backdrop-filter: blur(10px); z-index: 2;
  }
  .center {
    position: absolute; inset: 0 0 115px 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 2; gap: 22px;
  }
  .hook {
    font-size: 1.2rem; font-weight: 500; font-style: italic;
    color: rgba(255,255,255,.7); letter-spacing: .5px;
  }
  .vs-row { display: flex; align-items: center; gap: 24px; }
  .card {
    border-radius: 18px; padding: 24px 38px; text-align: center;
    backdrop-filter: blur(12px);
  }
  .card.solid {
    background: rgba(255,255,255,.2); border: 1.5px solid rgba(255,255,255,.38);
  }
  .card.outline {
    background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.2);
  }
  .formula {
    font-family: 'Courier New', monospace;
    font-size: 2.8rem; font-weight: 900; color: #fff; letter-spacing: 2px;
    text-shadow: 0 2px 20px rgba(0,0,0,.4);
  }
  .formula-label {
    font-size: .75rem; font-weight: 700; letter-spacing: 3px;
    color: rgba(255,255,255,.6); margin-top: 8px; text-transform: uppercase;
  }
  .vs-badge {
    font-size: 1.6rem; font-weight: 900; color: #fbbf24;
    background: rgba(0,0,0,.3); border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 50%; width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
  }
  .subtitle {
    font-size: 1.0rem; font-weight: 600; letter-spacing: 3px;
    color: rgba(255,255,255,.65); text-transform: uppercase;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 115px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 52px; z-index: 2;
  }
  .title-text { font-size: 1.45rem; font-weight: 800; color: #fff; line-height: 1.25; }
  .url { font-size: .75rem; color: rgba(255,255,255,.4); letter-spacing: 1px; white-space: nowrap; margin-left: 24px; }
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="noise"></div>

  <div class="brand"><div class="brand-dot"></div><div class="brand-name">Parling Academy</div></div>
  <div class="tag">GRAMÁTICA</div>

  <div class="center">
    <div class="hook">¿Cuándo usar cada uno?</div>
    <div class="vs-row">
      <div class="card solid">
        <div class="formula">have + V³</div>
        <div class="formula-label">Present Perfect</div>
      </div>
      <div class="vs-badge">vs</div>
      <div class="card outline">
        <div class="formula">V²</div>
        <div class="formula-label">Simple Past</div>
      </div>
    </div>
    <div class="subtitle">La guía definitiva para hispanohablantes</div>
  </div>

  <div class="bottom-bar">
    <div class="title-text">Present Perfect vs Simple Past: la guía definitiva</div>
    <div class="url">parlingacademy.com/blog</div>
  </div>
</body>
</html>
