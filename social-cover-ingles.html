<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #2e1065 0%, #4c1d95 50%, #7c3aed 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    position: relative;
  }
  .circle-tr {
    position: absolute; top: -160px; right: -100px;
    width: 520px; height: 520px; border-radius: 50%;
    background: rgba(167,139,250,.22);
  }
  .circle-bl {
    position: absolute; bottom: -130px; left: -80px;
    width: 400px; height: 400px; border-radius: 50%;
    background: rgba(124,58,237,.3);
  }
  .circle-mid {
    position: absolute; top: 180px; left: 260px;
    width: 200px; height: 200px; border-radius: 50%;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.07);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .brand {
    position: absolute; top: 42px; left: 52px;
    display: flex; align-items: center; gap: 10px; z-index: 2;
  }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: #fbbf24; }
  .brand-name {
    font-size: .8rem; font-weight: 800; letter-spacing: 3px;
    text-transform: uppercase; color: rgba(255,255,255,.7);
  }
  .tag {
    position: absolute; top: 36px; right: 52px;
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.28);
    color: #fff; font-size: .78rem; font-weight: 700;
    letter-spacing: 2px; padding: .4rem 1.1rem; border-radius: 20px;
    backdrop-filter: blur(10px); z-index: 2;
  }
  .center {
    position: absolute; inset: 0 0 115px 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 1; gap: 6px;
  }
  .hook {
    font-size: 1.15rem; font-weight: 500; font-style: italic;
    color: rgba(255,255,255,.65); letter-spacing: .5px;
  }
  .num-row {
    display: flex; align-items: center; gap: 20px; line-height: 1;
  }
  .big-num {
    font-size: 17rem; font-weight: 900; color: #fff;
    line-height: .85; letter-spacing: -10px;
    text-shadow: 0 0 80px rgba(255,255,255,.25), 0 8px 40px rgba(0,0,0,.3);
  }
  .unit-block { display: flex; flex-direction: column; gap: 6px; }
  .unit {
    font-size: 3rem; font-weight: 900; color: #fbbf24;
    letter-spacing: 3px; text-transform: uppercase;
    text-shadow: 0 0 30px rgba(251,191,36,.5);
  }
  .flag { font-size: 3.8rem; line-height: 1; }
  .subtitle {
    font-size: 1.1rem; font-weight: 500;
    color: rgba(255,255,255,.7); letter-spacing: 2px;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 115px;
    background: rgba(0,0,0,.35); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 52px; z-index: 2;
  }
  .title-text {
    font-size: 1.45rem; font-weight: 800; color: #fff; line-height: 1.25;
  }
  .url { font-size: .75rem; color: rgba(255,255,255,.4); letter-spacing: 1px; white-space: nowrap; margin-left: 24px; }
</style>
</head>
<body>
  <div class="circle-tr"></div>
  <div class="circle-bl"></div>
  <div class="circle-mid"></div>
  <div class="dots"></div>

  <div class="brand"><div class="brand-dot"></div><div class="brand-name">Parling Academy</div></div>
  <div class="tag">INGLÉS</div>

  <div class="center">
    <div class="hook">Si empezaras hoy...</div>
    <div class="num-row">
      <div class="big-num">6</div>
      <div class="unit-block">
        <div class="unit">meses</div>
        <div class="flag">🇬🇧</div>
      </div>
    </div>
    <div class="subtitle">para hablar inglés con fluidez</div>
  </div>

  <div class="bottom-bar">
    <div class="title-text">Cómo aprender inglés en 6 meses desde cero</div>
    <div class="url">parlingacademy.com/blog</div>
  </div>
</body>
</html>
