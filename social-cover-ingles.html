<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0d0d12 0%, #1a0830 50%, #2d1060 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f1f1f6;
    position: relative;
  }
  .glow-tl {
    position: absolute; top: -120px; left: -80px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,58,237,.45) 0%, transparent 65%);
  }
  .glow-br {
    position: absolute; bottom: -100px; right: -60px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(167,139,250,.2) 0%, transparent 70%);
  }
  .grid-lines {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .brand {
    position: absolute; top: 36px; left: 48px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
  }
  .brand-name {
    font-size: .85rem; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: rgba(167,139,250,.7);
  }
  .tag {
    position: absolute; top: 36px; right: 48px;
    background: rgba(124,58,237,.2); border: 1px solid rgba(124,58,237,.4);
    color: #a78bfa; font-size: .78rem; font-weight: 700;
    letter-spacing: 2px; padding: .4rem 1rem; border-radius: 20px;
  }
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 1;
  }
  .flag { font-size: 5rem; line-height: 1; margin-bottom: 10px; }
  .big-num {
    font-size: 18rem; font-weight: 900; color: #7c3aed; line-height: .85;
    text-shadow: 0 0 120px rgba(124,58,237,.7), 0 0 40px rgba(124,58,237,.4);
    letter-spacing: -12px;
  }
  .label {
    font-size: 1.15rem; font-weight: 700; letter-spacing: 6px;
    color: #a78bfa; text-transform: uppercase; margin-top: 14px;
  }
  .title {
    position: absolute; bottom: 48px; left: 48px; right: 48px;
    font-size: 1.55rem; font-weight: 800; color: #f1f1f6;
    line-height: 1.3;
  }
  .url {
    position: absolute; bottom: 52px; right: 48px;
    font-size: .78rem; color: rgba(167,139,250,.5);
    letter-spacing: 1px;
  }
  .divider {
    position: absolute; bottom: 100px; left: 48px; right: 48px;
    height: 1px; background: rgba(124,58,237,.2);
  }
</style>
</head>
<body>
  <div class="glow-tl"></div>
  <div class="glow-br"></div>
  <div class="grid-lines"></div>

  <div class="brand">
    <div class="brand-dot"></div>
    <div class="brand-name">Parling Academy</div>
  </div>
  <div class="tag">INGLÉS</div>

  <div class="center">
    <div class="flag">🇬🇧</div>
    <div class="big-num">6</div>
    <div class="label">meses para hablar con fluidez</div>
  </div>

  <div class="divider"></div>
  <div class="title">Cómo aprender inglés en 6 meses desde cero</div>
  <div class="url">parlingacademy.com/blog</div>
</body>
</html>
